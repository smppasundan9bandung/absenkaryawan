<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Absen Karyawan SMP Pasundan 9</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a; /* Sleek dark background matching app shell */
      -webkit-tap-highlight-color: transparent;
    }

    /* Iframe Container Fullscreen Fit */
    .app-iframe {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      outline: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    id="web-app-frame"
    src="https://script.google.com/macros/s/AKfycbxpM96b1idp3nWEEZ_hDKvsq7C8MkHauXpoUk0HvQfMxtAzgxeBaTZJm7z3p2xWKT5i/exec" 
    class="app-iframe"
    allow="geolocation *; camera *; microphone *; display-capture *;"
    allowfullscreen="true"
    sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation">
  </iframe>

</body>
</html>
